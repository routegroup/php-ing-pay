# Builds the usage docs in docs/ and deploys them to GitHub Pages at
# https://php-ing-pay.routegroup.pl. Pull requests build only.
name: docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      # The Enums reference is read from here at build time.
      - 'src/Types/**'
      - 'tests/Docs/**'
      - 'tests/Fixtures/Notifications/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      # The Enums reference is read from here at build time.
      - 'src/Types/**'
      - 'tests/Docs/**'
      - 'tests/Fixtures/Notifications/**'
      - '.github/workflows/docs.yml'
  # laravel-ing-pay dispatches this when its samples change.
  repository_dispatch:
    types: [laravel-docs-updated]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: docs

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: docs/.nvmrc
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run docs:build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # One deploy at a time, and never cancel one halfway. Only this job is in
    # the group, so a pull request build can't displace a queued deploy.
    concurrency:
      group: pages
      cancel-in-progress: false

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
