# Opens an issue when the imoje API changelog gets a new entry — ING Pay runs
# on that gateway, so its changes land here.
#
# GitHub disables a schedule after ~60 days without commits in a public repo.
name: upstream-watch

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: upstream-watch
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Watch the imoje API changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/upstream-watch.py
